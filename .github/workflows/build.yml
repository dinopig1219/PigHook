name: Build APK

on:
  push:
    branches: [ main ]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build App
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build debug + release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_COMMIT_SHA: ${{ github.sha }}
          APP_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: gradle assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION_NAME="${{ github.event.release.tag_name }}"
          else
            VERSION_NAME="1.0-${GITHUB_SHA::7}"
          fi

          VERSION_CODE="${{ github.run_number }}"

          mv "app/build/outputs/apk/debug/app-debug.apk" \
            "app/build/outputs/apk/debug/PigHook_${VERSION_NAME}(${VERSION_CODE})-debug.apk"

          mv "app/build/outputs/apk/release/app-release.apk" \
            "app/build/outputs/apk/release/PigHook_${VERSION_NAME}(${VERSION_CODE}).apk"

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
